# Does it compile, and do the tests pass.
#
# Linux only, deliberately. This repository is private, so Actions minutes are
# metered and weighted: Linux counts 1x, Windows 2x and macOS **10x**. A push
# that checked all three cost about 80 billable minutes, roughly 70 of which
# were macOS alone — out of 2000 a month. Checking one platform costs about two.
#
# What that gives up is macOS- and Windows-specific breakage, which now surfaces
# when a release is built. That is survivable: a failed release publishes
# nothing (the publish job needs all four builds), and re-cutting a tag is
# cheap. Windows is covered anyway — it is the machine this is developed on.
#
# Before a release, it is still worth running `cargo clippy -j 1 --all-targets`
# and `cargo test -j 1` locally, which costs nothing at all.

name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run build` is `tsc --noEmit && vite build`, so this covers both the
      # types and the bundle the Rust side will be handed.
      - run: npm run build

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential

      # No `cargo fmt --check`, deliberately: the tree is hand-wrapped narrower
      # than rustfmt wants in about thirty places, and the formatting it would
      # impose is not wanted. Run `cargo fmt` here and it will reflow them.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      # `tauri build` runs this first, and the Rust build needs `../dist` to
      # exist before it will compile at all.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Single-job everywhere, for the same reason the project builds that way
      # locally: a runner has less memory than the dev machine, not more.
      - run: cargo clippy -j 1 --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test -j 1
        working-directory: src-tauri

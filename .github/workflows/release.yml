# Builds Lapis for Windows, macOS and Linux and publishes the installers to the
# public JulesFouchy/lapis-releases repository, which is where the in-app
# updater looks.
#
# Two repositories because this one is private: a private repo's release assets
# need a token to download, and the updater has none. Only the built installers
# cross over; the source does not.
#
# To cut a release, run `node scripts/release.mjs 0.2.0`, which does the whole
# thing. Everything after the tag is pushed happens here, unattended.
#
# The tag must match the version in all three manifests, and `CHANGELOG.md`
# must have a section for it — the first job refuses the build otherwise. A
# version mismatch produces an update that every client downloads and then
# declines to apply.
#
# This is the only workflow. Ordinary pushes run nothing: the checks that would
# catch a bad commit are the same ones run locally, and a private repo's Actions
# minutes are better spent on releases.
#
# The release is built as a draft and published by the last job, once all four
# platforms have uploaded. Publishing is the moment existing installs begin
# seeing the new version, so it must not happen while assets are still missing.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Two releases building into the same tag would race over the same assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap, and it runs before three platform builds rather than after them.
  check-version:
    runs-on: ubuntu-22.04
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match every version in the tree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          node scripts/set-version.mjs
          bad=0
          for v in $(node scripts/set-version.mjs | awk '{print $1}'); do
            [ "$v" = "$tag" ] || bad=1
          done
          if [ "$bad" = 1 ]; then
            echo "::error::tag v$tag does not match the versions above — run: node scripts/set-version.mjs $tag"
            exit 1
          fi
          echo "releasing $tag"

      # The release notes are the CHANGELOG's section for this version, so the
      # file in the repo and the text on the release cannot drift apart.
      - name: Release notes from CHANGELOG.md
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          body=$(awk -v v="$tag" '
            $0 ~ "^## " v { want = 1; next }
            want && /^## / { exit }
            want { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$body" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no '## $tag' section"
            exit 1
          fi
          {
            echo "notes<<LAPIS_EOF"
            echo "$body"
            echo "LAPIS_EOF"
          } >> "$GITHUB_OUTPUT"

  # Clippy and the tests, on the cheapest runner, before anything expensive
  # starts. There is no CI on ordinary pushes — this is developed and tested on
  # one machine, and paying for a second opinion on every commit is not worth
  # it. But a release fans out to four runners, two of them macOS at 10x, and
  # discovering a broken build after those have run costs about 240 billable
  # minutes. Discovering it here costs three.
  verify:
    needs: check-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             libappindicator3-dev             librsvg2-dev             patchelf             libxdo-dev             build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # `shared-key` rather than the default, which folds the job's *name* into
      # the cache key and so gives `verify` and `build` separate copies of the
      # same dependency tree. With this, the Linux build below restores what
      # this job just compiled.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: lapis
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Also `tsc --noEmit`, and the Rust build needs `../dist` to exist.
      - run: npm run build

      # No `cargo fmt --check`: the tree is hand-wrapped narrower than rustfmt
      # wants in about thirty places, and that formatting is not wanted.
      - run: cargo clippy -j 1 --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test -j 1
        working-directory: src-tauri

  build:
    # Both, not just `verify`: a job can read `needs.<job>.outputs` only for
    # jobs named in its own `needs`. With `verify` alone in the way, the release
    # notes from `check-version` silently became an empty string, and 0.1.2
    # went out with no body.
    needs: [check-version, verify]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two macOS bundles rather than one universal binary: a universal
          # build doubles the download for every user to spare a second
          # architecture's build minutes, and minutes are the cheaper of the two.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust-targets: x86_64-apple-darwin
          # Not `ubuntu-latest`: the AppImage and the .deb link against the
          # glibc of whatever built them, so building on the oldest supported
          # runner is what decides the oldest distro Lapis will start on.
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Shared with the `verify` job above, which has already compiled this on
      # Linux by the time this runs. The runner's OS and architecture are part
      # of the key regardless, so Windows and Linux do not collide; the target
      # is spelled out because the two macOS builds share a runner label.
      #
      # Note that none of this survives *between* releases. Actions caches are
      # scoped to the ref that wrote them plus the default branch, and this
      # workflow only ever runs on tags — so each release writes caches onto
      # its own tag, where the next release cannot see them. Warming them would
      # mean building all four platforms on `main`, which costs more than it
      # saves at this release rate.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: lapis${{ matrix.args }}
          # Save the dependency cache even when the build fails. Without this a
          # release that dies in Lapis's own code — which is the usual way for
          # one to die — throws away the twenty minutes of dependencies it had
          # already compiled, and the re-run after the fix starts cold.
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          # Writes to a different repository than this workflow runs in, so the
          # built-in GITHUB_TOKEN is no use. A fine-grained PAT scoped to
          # lapis-releases with Contents: read and write.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # The half of the updater keypair that proves an installer came from
          # here. Losing it means never being able to update an install again.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: JulesFouchy
          repo: lapis-releases
          # The tag is cut against a commit in *this* repo, which does not exist
          # over there, so the release has to be anchored to a ref that does.
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: "Lapis ${{ github.ref_name }}"
          releaseBody: ${{ needs.check-version.outputs.notes }}
          # Draft until every platform has uploaded, then published by the job
          # below. A release that is public the moment the first job finishes
          # is a release whose `latest.json` offers an update to everyone while
          # three of the four installers do not exist yet.
          releaseDraft: true
          prerelease: false
          # `latest.json`, which is the file the app actually fetches.
          uploadUpdaterJson: true
          # Prefer the NSIS setup.exe over the MSI: `installMode: currentUser`
          # means it updates without an administrator prompt.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # Flips the draft to published, which is the moment every existing install
  # starts being offered the new version. Only once all four builds have
  # uploaded, so `latest.json` never advertises an installer that is missing.
  publish:
    needs: build
    # A `workflow_dispatch` on a branch has no tag and no release to publish.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          repo=repos/JulesFouchy/lapis-releases
          id=$(gh api "$repo/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [ -z "$id" ]; then
            echo "::error::no release found for $TAG"
            exit 1
          fi
          gh api -X PATCH "$repo/releases/$id" -F draft=false --jq '.html_url'

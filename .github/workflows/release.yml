# Builds Lazuli for Windows, macOS and Linux and publishes the installers to the
# public JulesFouchy/lazuli-releases repository, which is where the in-app
# updater looks.
#
# Two repositories because this one is private: a private repo's release assets
# need a token to download, and the updater has none. Only the built installers
# cross over; the source does not.
#
# To cut a release, run `node scripts/release.mjs 0.2.0`, which does the whole
# thing. Everything after it dispatches this workflow happens here, unattended.
#
# **This runs on `main`, and is dispatched with the version — it is not
# triggered by the tag.** That is deliberate, and it is the only reason the
# build caches survive from one release to the next. An Actions cache is
# readable from the ref the run wrote it on, plus the default branch, and
# nothing else. A run triggered by `v0.3.0` writes its caches into a scope named
# after that tag, which no later tag can read — so every release built all four
# platforms cold, and the cache step was pure cost. Dispatched on `main`, the
# same step writes into main's scope, where every later release reads it.
#
# It still builds the *tag*: the checkout steps take `refs/tags/v<version>`
# explicitly, so what ships is the tagged commit and not whatever has landed on
# main since. Only the cache scope comes from `main`.
#
# The caveat is GitHub's eviction: a cache unread for seven days is deleted, and
# only a release reads these. Releases closer together than a week stay warm;
# after a longer gap the next one is cold again and re-warms on its way through.
# Nothing keeps them alive without running CI between releases, which is not
# worth ~70 billable minutes a week to avoid ~90 once.
#
# The version must match all three manifests, and `CHANGELOG.md` must have a
# section for it — the first job refuses the build otherwise. A version mismatch
# produces an update that every client downloads and then declines to apply.
#
# Nothing here re-runs clippy or the tests. `scripts/release.mjs` runs them
# before it cuts the tag, which is the only point at which failing is cheap —
# once the tag is pushed, a failure has to be undone by deleting it. Ordinary
# pushes run no checks either, for the same reason: this is developed and tested
# on one machine, and a private repo's Actions minutes are better spent on
# releases.
#
# The release is built as a draft and published by the last job, once all four
# platforms have uploaded. Publishing is the moment existing installs begin
# seeing the new version, so it must not happen while assets are still missing.

name: Release

# No tag trigger: pushing a tag by hand releases nothing. `scripts/release.mjs`
# dispatches this, and dispatching it by hand from `main` works too — the tag
# has to exist already, because the build checks it out.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.3.0 — its tag must already be pushed"
        required: true
        type: string

# Two releases building into the same tag would race over the same assets.
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # Cheap, and it runs before three platform builds rather than after them.
  check-version:
    runs-on: ubuntu-22.04
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    env:
      TAG: v${{ inputs.version }}
    steps:
      # The tag, not `main`: the run's ref is what scopes the cache, but what
      # gets built and checked has to be the commit that was tagged. This also
      # fails the release outright if the tag was never pushed.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version must match every version in the tree
        run: |
          tag="${TAG#v}"
          node scripts/set-version.mjs
          bad=0
          for v in $(node scripts/set-version.mjs | awk '{print $1}'); do
            [ "$v" = "$tag" ] || bad=1
          done
          if [ "$bad" = 1 ]; then
            echo "::error::$TAG does not match the versions above — run: node scripts/set-version.mjs $tag"
            exit 1
          fi
          echo "releasing $tag"

      # The release notes are the CHANGELOG's section for this version, so the
      # file in the repo and the text on the release cannot drift apart.
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          tag="${TAG#v}"
          body=$(awk -v v="$tag" '
            $0 ~ "^## " v { want = 1; next }
            want && /^## / { exit }
            want { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$body" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no '## $tag' section"
            exit 1
          fi
          {
            echo "notes<<LAZULI_EOF"
            echo "$body"
            echo "LAZULI_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    # A job can read `needs.<job>.outputs` only for jobs named in its own
    # `needs`. When another job stood between this one and `check-version`, the
    # release notes silently became an empty string and 0.1.2 went out with no
    # body.
    needs: check-version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two macOS bundles rather than one universal binary: a universal
          # build doubles the download for every user to spare a second
          # architecture's build minutes, and minutes are the cheaper of the two.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust-targets: x86_64-apple-darwin
          # Not `ubuntu-latest`: the AppImage and the .deb link against the
          # glibc of whatever built them, so building on the oldest supported
          # runner is what decides the oldest distro Lazuli will start on.
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # The runner's OS and architecture are part of the key regardless, so
      # Windows and Linux do not collide; the target is spelled out because the
      # two macOS builds share a runner label.
      #
      # This both restores and saves in `main`'s cache scope, because the run
      # was dispatched on `main` — see the note at the top of the file. That is
      # what makes the step worth having: every release warms the next one.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: lazuli${{ matrix.args }}
          # Save the dependency cache even when the build fails. Without this a
          # release that dies in Lazuli's own code — which is the usual way for
          # one to die — throws away the twenty minutes of dependencies it had
          # already compiled, and the re-run after the fix starts cold.
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          # Writes to a different repository than this workflow runs in, so the
          # built-in GITHUB_TOKEN is no use. A fine-grained PAT scoped to
          # lazuli-releases with Contents: read and write.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # The half of the updater keypair that proves an installer came from
          # here. Losing it means never being able to update an install again.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: JulesFouchy
          repo: lazuli-releases
          # The tag is cut against a commit in *this* repo, which does not exist
          # over there, so the release has to be anchored to a ref that does.
          releaseCommitish: main
          tagName: v${{ inputs.version }}
          releaseName: "Lazuli v${{ inputs.version }}"
          releaseBody: ${{ needs.check-version.outputs.notes }}
          # Draft until every platform has uploaded, then published by the job
          # below. A release that is public the moment the first job finishes
          # is a release whose `latest.json` offers an update to everyone while
          # three of the four installers do not exist yet.
          releaseDraft: true
          prerelease: false
          # `latest.json`, which is the file the app actually fetches.
          uploadUpdaterJson: true
          # Prefer the NSIS setup.exe over the MSI: `installMode: currentUser`
          # means it updates without an administrator prompt.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # Flips the draft to published, which is the moment every existing install
  # starts being offered the new version. Only once all four builds have
  # uploaded, so `latest.json` never advertises an installer that is missing.
  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: v${{ inputs.version }}
        run: |
          repo=repos/JulesFouchy/lazuli-releases
          id=$(gh api "$repo/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [ -z "$id" ]; then
            echo "::error::no release found for $TAG"
            exit 1
          fi
          gh api -X PATCH "$repo/releases/$id" -F draft=false --jq '.html_url'

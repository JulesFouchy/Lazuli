# Builds the dependency tree on `main`, so that releases can reuse it.
#
# Actions caches are readable from the ref that wrote them and from the default
# branch, and nothing else. The release workflow only ever runs on tags, so
# every release writes its caches onto its own tag where the next release cannot
# see them — each release starts cold. This job exists to put the same caches on
# `main`, which every tag run can read.
#
# **Run it from `main`.** A run from any other ref writes the cache onto that
# ref and helps nobody.
#
# It compiles with `cargo build`, not `tauri build`: what is being cached is the
# dependency tree, and packaging a .dmg or an installer adds minutes that cache
# nothing. The keys must match the release workflow's `shared-key` exactly, so
# the two matrices have to stay identical — that is the one thing to check if a
# release ever starts cold again.
#
# ## When it runs
#
# Nothing here is manual, because for its first six months nothing ran it: the
# workflow was dispatch-only, was never dispatched once, and every release in
# that time built all four platforms cold.
#
# - **On a push to `main` that touches `Cargo.lock` or `Cargo.toml`.** Those are
#   the files in the cache key, so a change to either is what makes the warm
#   cache stale.
# - **Weekly.** Two reasons. GitHub deletes a cache that has not been *read* for
#   seven days, and restoring one resets that clock — so this keeps the caches
#   alive across a quiet fortnight that would otherwise silently undo the
#   warming. And `rustc` goes up a stable release every six weeks, which changes
#   every key with no file changing to announce it; the weekly run finds that as
#   a cache miss and rebuilds.
#
# The weekly run therefore only *restores* in the normal case and skips the
# build entirely — about four minutes across the matrix. It pays the full cost
# only on a miss, which is the case where the cache was worthless anyway.
#
# ## What it costs
#
# A full warm is about 160 billable minutes, against roughly 90 saved per
# release, so it pays for itself on the second release that uses it. Measured:
# the Windows build went 16m22s cold to 4m47s warm, and Linux 9m00s to 4m30s.

name: Warm build cache

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/Cargo.lock"
      - "src-tauri/Cargo.toml"
  schedule:
    # Mondays, early. Any weekday would do; the point is that it is inside the
    # seven-day window, not which day it lands on.
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: warm-cache
  cancel-in-progress: true

jobs:
  warm:
    strategy:
      fail-fast: false
      # Identical to the release workflow's build matrix. If they drift, the
      # cache keys drift with them and the warming silently stops working.
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust-targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to run anywhere but main
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::run this from main — a cache written on $GITHUB_REF is readable only from $GITHUB_REF"
            exit 1
          fi

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Restoring is the whole job when the cache is already good: it resets the
      # seven-day eviction clock, and everything below is then skipped.
      - uses: swatinem/rust-cache@v2
        id: cache
        with:
          workspaces: "./src-tauri -> target"
          shared-key: lazuli${{ matrix.args }}
          cache-on-failure: true

      # Unconditional: this restores the npm cache, which needs the same
      # keepalive as the Rust one.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      # `generate_context!` reads the built frontend, so the Rust build will not
      # compile without `../dist` present.
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm run build

      # Release profile, because that is what a release builds and debug
      # artifacts would not be reused. Single-job for the same reason as
      # everywhere else.
      - if: steps.cache.outputs.cache-hit != 'true'
        run: cargo build -j 1 --release ${{ matrix.args }}
        working-directory: src-tauri

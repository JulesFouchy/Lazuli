<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `interactive-widget=resizes-content` is what moves the page up when a
      soft keyboard opens. Without it the keyboard is laid over the page and
      the field being typed into can end up behind it.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>Lazuli</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      // Which platform, before the first paint and for the same reason the
      // theme is settled here: the stylesheet keys off `[data-platform]`, and a
      // module import lands a frame too late to spare a wrong first frame.
      //
      // The user agent, because `@tauri-apps/plugin-os` is an async import and
      // that is exactly the frame being avoided. Read it through
      // `src/platform.ts`, which turns it into what a build can *do* rather
      // than what it is running on.
      (function bootPlatform() {
        var agent = navigator.userAgent;
        document.documentElement.dataset.platform = /Android/.test(agent)
          ? "android"
          : /iPhone|iPad|iPod/.test(agent)
            ? "ios"
            : "desktop";
      })();
    </script>
    <script>
      // Blocking on purpose, and duplicated from `src/theme.ts` on purpose: the
      // module graph is fetched after the first paint, so anything left to it
      // shows a frame of the wrong theme first. Only what is visible at that
      // size is done here — the accent's derived shades follow a frame later,
      // which is why the keys and the `system` fallback must match `theme.ts`.
      (function bootTheme() {
        try {
          var choice = localStorage.getItem("lazuli.theme") || "dark";
          var dark =
            choice === "dark" ||
            (choice !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var accent = localStorage.getItem("lazuli.accent");
          if (accent && /^#[0-9a-f]{6}$/i.test(accent)) {
            document.documentElement.style.setProperty("--accent", accent);
          }
          var bg = localStorage.getItem(dark ? "lazuli.bg.dark" : "lazuli.bg.light");
          if (bg && /^#[0-9a-f]{6}$/i.test(bg)) {
            document.documentElement.style.setProperty("--bg", bg);
          }
        } catch (err) {
          // Private-mode storage, or none at all. The stylesheet's own defaults
          // are a complete theme, so there is nothing to fall back to.
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="toasts" class="toasts"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

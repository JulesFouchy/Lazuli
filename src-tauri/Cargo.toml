[package]
name = "lapis"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
name = "lapis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png` is what lets the window be given its icon from the PNG in
# `icons/`, rather than inheriting whatever icon the executable was built with.
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Only for `relaunch` after an update has been installed. On Windows the NSIS
# updater restarts the app itself, but a macOS or Linux update leaves the old
# process running against the new files, so it has to ask.
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
notify = "7"
notify-debouncer-full = "0.4"
trash = "5"

[target.'cfg(windows)'.dependencies]
# Already in the tree through tauri; pinned to the same version so it is not
# built twice. Reads the OS light/dark preference before any window exists.
winreg = "0.55"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# Desktop-only by construction: there is no updater for iOS or Android, so the
# target filter is what keeps a mobile build compiling should one ever exist.
tauri-plugin-updater = "2"

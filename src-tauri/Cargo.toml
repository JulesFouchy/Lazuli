[package]
name = "journaley"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "journaley_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
notify = "7"
notify-debouncer-full = "0.4"
trash = "5"

[target.'cfg(windows)'.dependencies]
# Already in the tree through tauri; pinned to the same version so it is not
# built twice. Reads the OS light/dark preference before any window exists.
winreg = "0.55"

[package]
name = "lazuli"
version = "0.4.0"
edition = "2021"
rust-version = "1.82"

[lib]
name = "lazuli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png` is what lets the window be given its icon from the PNG in
# `icons/`, rather than inheriting whatever icon the executable was built with.
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
notify = "7"
notify-debouncer-full = "0.4"
# Already in the tree through tauri. An image arrives from the page as the
# request body, so its name has to travel in a header, and a header is ASCII —
# see `commands::import_image_bytes`.
percent-encoding = "2"
# Already in the tree through tauri's `image-png`, which is PNG only; the extra
# features are the formats a camera and a phone actually produce. Thumbnails
# are decoded and re-encoded with it — see `thumbs.rs`.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
] }
# Already in the tree through tauri. Compares a downloaded update's version
# with the running one, at the launch that applies it.
semver = "1"

[target.'cfg(windows)'.dependencies]
# Already in the tree through tauri; pinned to the same version so it is not
# built twice. Reads the OS light/dark preference before any window exists.
winreg = "0.55"
# Same: already in the tree through tauri, same version so it is not built
# twice. `SendInput`, to press the Menu key — see `keys.rs`.
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
# Also already in the tree through wry, which is what makes the version a copy
# rather than a choice. The WebView2 permission event — see `camera.rs`.
webview2-com = "0.38"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# Desktop-only by construction: there is no updater for iOS or Android, so the
# target filter is what keeps a mobile build compiling.
tauri-plugin-updater = "2"
# Same, and for a blunter reason: the crate has no mobile backend at all and
# does not compile for one. It is the last step of a deletion, thirty days
# after the user asked for it — and a phone has no system trash to be that
# step. See `trashcan::hand_on`.
trash = "5"
